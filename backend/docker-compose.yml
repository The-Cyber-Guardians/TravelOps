services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travelops
      POSTGRES_USER: travelops
      POSTGRES_PASSWORD: travelops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelops -d travelops"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    command: >-
      sh -c "python manage.py migrate &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: local-compose-secret-key
      POSTGRES_DB: travelops
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: travelops
      POSTGRES_PORT: 5432
      POSTGRES_USER: travelops
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
