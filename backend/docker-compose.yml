version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travelops
      POSTGRES_USER: travelops
      POSTGRES_PASSWORD: travelops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelops -d travelops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: